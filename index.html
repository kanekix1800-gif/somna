    <script>
      // Celular (tela estreita + toque): esconde a barra de status e o home indicator simulados do app,
      // porque o aparelho de verdade já mostra os dele.
      (function () {
        try {
          var mm = window.matchMedia;
          if (mm && mm('(max-width: 500px)').matches && mm('(pointer: coarse)').matches) {
            var s = document.createElement('style');
            s.id = 'somna-celular';
            s.textContent = "\n.somna-device > div[aria-hidden=\"true\"][style*=\"top: 0\"][style*=\"height: 44px\"],\n.somna-device > div[aria-hidden=\"true\"][style*=\"width: 134px\"][style*=\"height: 5px\"] { display: none !important; }\n/* Os mesmos dois pela ordem fixa do DeviceFrame (telas, StatusBar, HomeIndicator, .somna-notch). Regra à parte\n   porque um navegador sem :has() descarta a regra inteira. */\n.somna-device > div[aria-hidden=\"true\"]:has(+ div[aria-hidden=\"true\"] + .somna-notch),\n.somna-device > div[aria-hidden=\"true\"]:has(+ .somna-notch) { display: none !important; }\n/* Toque de app: sem realce cinza, sem menu de copiar ao segurar e sem o efeito elástico da página */\nhtml, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }\n* { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }\ninput, textarea { -webkit-touch-callout: default; -webkit-user-select: text; user-select: text; }\n";
            document.head.appendChild(s);
          }
        } catch (e) {}
      })();
    </script>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

/* ── Base ─────────────────────────────────────────────────────────────── */
/* Desktop: o aparelho fica centralizado e, se não couber na janela (mesmo reduzido até o piso), a PÁGINA rola.
   margin: auto na caixa centraliza quando sobra espaço e, quando falta, encosta no padding: o topo nunca é cortado. */
.somna-page { min-height: 100vh; min-height: 100dvh; display: flex; padding: 32px 24px; box-sizing: border-box;
  transition: background-color .4s ease; }
.somna-frame { margin: auto; flex-shrink: 0; }
.somna-device { position: relative; width: ${T.width}px; height: ${T.height}px; flex-shrink: 0; overflow: hidden;
  border-radius: 44px; isolation: isolate; transform-origin: 0 0; transition: background-color ${ae.screen}ms ease;
  box-shadow: 0 0 0 11px #0E1120, 0 0 0 12.5px #2C3150, 0 40px 90px -12px rgba(0,0,0,.55); }
.somna-notch { position: absolute; top: 0; left: 50%; width: 156px; height: 31px; margin-left: -78px; z-index: ${se.notch};
  background: #000; border-radius: 0 0 20px 20px; pointer-events: none; }
@media (max-width: 500px) {
  .somna-page { height: 100vh; height: 100dvh; padding: 0; overflow: hidden; }
  .somna-frame { margin: 0; width: auto !important; height: auto !important; }
  .somna-device { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; transform: none !important; }
  .somna-notch { display: none; }
}
.somna-root { font-family: ${w}; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility; -webkit-text-size-adjust: 100%; }
.somna-root, .somna-root *, .somna-root *::before, .somna-root *::after { box-sizing: border-box; }
.somna-root h1, .somna-root h2, .somna-root h3, .somna-root h4, .somna-root p, .somna-root ul, .somna-root ol { margin: 0; padding: 0; }
.somna-root button, .somna-root input, .somna-root textarea, .somna-root select { font: inherit; color: inherit; letter-spacing: inherit; }
.somna-root button { -webkit-tap-highlight-color: transparent; }
.somna-root ::selection { background: var(--somna-accent-soft); }
.somna-root :focus { outline: none; }
.somna-root :focus-visible { outline: 2.5px solid var(--somna-focus); outline-offset: 2px; }
/* Área rolável que o navegador torna focável (sem nada clicável dentro): anel por DENTRO — por fora seria
   cortado pelas bordas do aparelho ou pelo esmaecimento (mask-image) do paywall */
.somna-root .somna-scroll:focus-visible { outline-offset: -3px; }

/* Troca de tema suave: aplicada por ~0,4s no dispositivo logo após mudar modo/tema de cor.
   transform/opacity entram na lista (com curva própria) para não "congelar" o que desliza no mesmo instante
   (indicador do SegmentedControl, anel do tema selecionado, feedback de toque). */
.somna-theme-anim, .somna-theme-anim *, .somna-theme-anim *::before, .somna-theme-anim *::after {
  transition-property: background-color, color, border-color, fill, stroke, box-shadow, outline-color, transform, opacity !important;
  transition-duration: ${ae.theme}ms, ${ae.theme}ms, ${ae.theme}ms, ${ae.theme}ms, ${ae.theme}ms,
    ${ae.theme}ms, ${ae.theme}ms, 340ms, ${ae.base}ms !important;
  transition-timing-function: ease, ease, ease, ease, ease, ease, ease, ${D.springSoft}, ease !important; }
/* Superfícies que sempre transicionam cor (use em elementos próprios com cor de tema) */
.somna-themed { transition: background-color .35s ease, border-color .35s ease, color .35s ease, box-shadow .35s ease; }

/* ── Pressable: estados de toque/hover com "camada de estado" em currentColor ── */
.somna-pressable { position: relative; cursor: pointer; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform .18s ${D.out}, background-color .35s ease, border-color .35s ease, color .25s ease, box-shadow .25s ease, opacity .2s ease; }
.somna-pressable::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: currentColor;
  opacity: 0; pointer-events: none; transition: opacity .18s ease; }
@media (hover: hover) and (pointer: fine) { .somna-pressable:hover::after { opacity: .045; } }
.somna-pressable:active::after { opacity: .09; }
.somna-pressable:active { transform: scale(.98); }
.somna-press-icon:active { transform: scale(.9); }
.somna-press-highlight:active, .somna-press-none:active { transform: none; }
.somna-press-none::after { display: none; }
.somna-press-highlight:focus-visible { outline-offset: -3px; }
.somna-pressable[aria-disabled="true"], .somna-pressable:disabled { cursor: default; }
.somna-pressable[aria-disabled="true"]:active, .somna-pressable:disabled:active { transform: none; }
.somna-pressable[aria-disabled="true"]::after, .somna-pressable:disabled::after { display: none; }
/* Amplia a área de toque para ≥44px sem mudar o visual (chips, botões pequenos) */
.somna-hit::before { content: ''; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: max(100%, 44px);
  transform: translate(-50%, -50%); }
/* Link textual: no toque reduz opacidade (padrão iOS), no hover sublinha */
.somna-textlink:active { opacity: .55; }
@media (hover: hover) and (pointer: fine) { .somna-textlink:hover { text-decoration: underline; text-underline-offset: 3px; } }
/* Texto só para leitores de tela: visualmente oculto, mas presente na árvore de acessibilidade */
.somna-sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap; border: 0; }

/* ── Rolagem ──────────────────────────────────────────────────────────── */
.somna-scroll { overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.somna-scroll::-webkit-scrollbar { display: none; width: 0; height: 0; }
.somna-hscroll { display: flex; gap: ${T.gap}px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-padding-inline: ${T.gutter}px; }
.somna-hscroll::-webkit-scrollbar { display: none; }
.somna-hscroll > * { scroll-snap-align: start; flex-shrink: 0; }
/* Dentro do corpo com gutter: sangra até as bordas e deixa espaço p/ sombras e anel de foco não serem cortados
   (24px embaixo = deslocamento + desfoque da sombra do Card no modo claro, 6px + 18px) */
.somna-hscroll-bleed { margin: -6px -${T.gutter}px -24px; padding: 6px ${T.gutter}px 24px; }

/* ── Campo de texto ───────────────────────────────────────────────────── */
/* height: 100% → o <input> ocupa a altura toda da caixa de 56px (alvo de toque ≥ 44px, não só a linha do texto).
   Sem font-size/font-weight próprios: o reset ".somna-root input { font: inherit }" (mais específico) sempre venceu —
   o campo é 16px/400, o corpo de texto da SPEC (e 16px evita o zoom automático do iOS no foco) */
.somna-input { appearance: none; -webkit-appearance: none; border: 0; outline: 0; background: transparent; width: 100%; height: 100%;
  min-width: 0; padding: 0; margin: 0; color: inherit; caret-color: var(--somna-accent); }
/* Placeholder no texto secundário puro (4,8:1 no claro, 5,0:1 no escuro): com opacity .75 ficava em 3,0–3,4:1 */
.somna-input::placeholder { color: var(--somna-text-secondary); }
.somna-input:focus-visible { outline: none; }

/* ── Slider (input range) — preenchimento accent até --somna-fill (use rangeFill()) ── */
.somna-range { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 44px; margin: 0; padding: 0;
  background: transparent; cursor: pointer; touch-action: pan-y; --somna-fill: 50%; }
.somna-range:focus-visible { outline: none; }
.somna-range::-webkit-slider-runnable-track { height: 8px; border-radius: 999px;
  background: linear-gradient(90deg, var(--somna-accent) 0%, var(--somna-accent-light) var(--somna-fill), var(--somna-track) var(--somna-fill), var(--somna-track) 100%); }
.somna-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; margin-top: -10px;
  border-radius: 50%; border: 0; background: #FFFFFF;
  box-shadow: 0 2px 8px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.04); transition: transform .15s ${D.out}, box-shadow .2s ease; }
.somna-range:active::-webkit-slider-thumb { transform: scale(1.12); }
.somna-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--somna-focus), 0 2px 8px rgba(0,0,0,.28); }
.somna-range::-moz-range-track { height: 8px; border-radius: 999px; background: var(--somna-track); }
.somna-range::-moz-range-progress { height: 8px; border-radius: 999px; background: var(--somna-accent); }
.somna-range::-moz-range-thumb { width: 28px; height: 28px; border: 0; border-radius: 50%; background: #FFFFFF;
  box-shadow: 0 2px 8px rgba(0,0,0,.28); }

/* ── Toggle (switch iOS) ──────────────────────────────────────────────── */
.somna-switch { position: relative; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 51px; height: 44px; padding: 0; margin: 0; border: 0; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.somna-switch:disabled { cursor: default; opacity: .45; }
.somna-switch-track { position: relative; display: block; width: 51px; height: 31px; border-radius: 999px;
  box-shadow: var(--somna-switch-edge, 0 0 0 0 transparent); transition: background-color .25s ease, box-shadow .2s ease; }
.somna-switch-knob { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 999px; background: #FFFFFF;
  box-shadow: 0 3px 8px rgba(0,0,0,.16), 0 1px 1px rgba(0,0,0,.14);
  transition: left .34s ${D.springSoft}, width .2s ${D.out}; }
.somna-switch[aria-checked="true"] .somna-switch-knob { left: 22px; }
.somna-switch:active:not(:disabled) .somna-switch-knob { width: 33px; }
.somna-switch[aria-checked="true"]:active:not(:disabled) .somna-switch-knob { left: 16px; }
.somna-switch:focus-visible { outline: none; }
/* Anel de foco SEPARADO do trilho: um vão na cor da superfície (os switches ficam em SettingsGroup) e o anel por fora.
   Colado ao trilho ligado, o anel tinha a cor do próprio accent (1,1–1,6:1) e o switch focado só parecia "crescer". */
.somna-switch:focus-visible .somna-switch-track {
  box-shadow: var(--somna-switch-edge, 0 0 0 0 transparent), 0 0 0 2px var(--somna-surface), 0 0 0 4.5px var(--somna-focus); }

/* ── Spinner ──────────────────────────────────────────────────────────── */
.somna-spinner { display: inline-block; flex-shrink: 0; border-radius: 50%; border-style: solid; border-color: currentColor;
  border-right-color: transparent; animation: somna-spin .75s linear infinite; }

/* ── Utilitários de animação (use via className) ─────────────────────── */
.somna-anim-fade-in { animation: somna-fade-in .4s ${D.out} both; }
.somna-anim-screen-in { animation: somna-screen-in .38s ${D.out} both; }
.somna-anim-pop-in { animation: somna-pop-in .42s ${D.spring} both; }
.somna-anim-pulse { animation: somna-pulse 2.4s ease-in-out infinite; }
.somna-anim-float { animation: somna-float 4.8s ease-in-out infinite; }
.somna-anim-spin { animation: somna-spin .9s linear infinite; }
.somna-anim-twinkle { animation: somna-twinkle 3.2s ease-in-out infinite; }
.somna-anim-wave { animation: somna-wave 1.8s ease-in-out infinite; transform-origin: 70% 80%; }
.somna-anim-shake { animation: somna-shake .42s cubic-bezier(.36,.07,.19,.97) both; }
.somna-anim-grow-y { animation: somna-grow-y .7s ${D.out} both; transform-origin: 50% 100%; }
/* Piscar do mascote (olhos abertos): achata no próprio centro por um instante a cada ~5s */
.somna-anim-blink { animation: somna-blink 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }

/* ── Keyframes ────────────────────────────────────────────────────────── */
@keyframes somna-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes somna-fade-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes somna-screen-in { from { opacity: 0; transform: translate3d(0, 8px, 0); } to { opacity: 1; transform: none; } }
@keyframes somna-slide-in-right { from { opacity: 0; transform: translate3d(32px, 0, 0); } to { opacity: 1; transform: none; } }
@keyframes somna-slide-in-left { from { opacity: 0; transform: translate3d(-32px, 0, 0); } to { opacity: 1; transform: none; } }
@keyframes somna-sheet-up {
  0% { transform: translate3d(0, 100%, 0); }
  64% { transform: translate3d(0, -1.6%, 0); }
  84% { transform: translate3d(0, 0.5%, 0); }
  100% { transform: translate3d(0, 0, 0); } }
@keyframes somna-sheet-down { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(0, 100%, 0); } }
@keyframes somna-overlay-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes somna-overlay-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes somna-pop-in { 0% { opacity: 0; transform: scale(.88); } 60% { opacity: 1; transform: scale(1.03); } 100% { opacity: 1; transform: scale(1); } }
@keyframes somna-pop-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(.94); } }
@keyframes somna-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes somna-float { 0%, 100% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(0, -10px, 0); } }
@keyframes somna-check-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes somna-spin { to { transform: rotate(360deg); } }
@keyframes somna-twinkle { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
@keyframes somna-wave { 0%, 100% { transform: rotate(0deg); } 15% { transform: rotate(18deg); } 30% { transform: rotate(-8deg); }
  45% { transform: rotate(14deg); } 60% { transform: rotate(-4deg); } 75% { transform: rotate(8deg); } }
@keyframes somna-shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-5px, 0, 0); } 40%, 60% { transform: translate3d(5px, 0, 0); } }
@keyframes somna-grow-y { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes somna-tab-pop { 0% { transform: scale(.82); } 55% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes somna-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.12); } }
/* Telas do Plus: confete (deslocamento por --plus-dx/--plus-dy/--plus-spin), anel do selo, reflexo do CTA e halo.
   Os estados finais são "em repouso": com movimento reduzido tudo vai direto para eles. */
@keyframes plus-burst {
  0% { opacity: 0; transform: translate3d(0, 0, 0) rotate(0deg) scale(.3); }
  14% { opacity: 1; }
  68% { opacity: 1; transform: translate3d(var(--plus-dx), var(--plus-dy), 0) rotate(calc(var(--plus-spin) * .7)) scale(1); }
  100% { opacity: 0; transform: translate3d(var(--plus-dx), calc(var(--plus-dy) + 34px), 0) rotate(var(--plus-spin)) scale(.85); } }
@keyframes plus-ring { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(2.1); } }
@keyframes plus-sheen {
  0%, 58% { transform: translate3d(-130%, 0, 0) skewX(-20deg); }
  100% { transform: translate3d(430%, 0, 0) skewX(-20deg); } }
@keyframes plus-breathe { 0%, 100% { opacity: .8; transform: scale(.95); } 50% { opacity: 1; transform: scale(1.04); } }

/* ── Movimento reduzido ───────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .somna-device, .somna-root *, .somna-root *::before, .somna-root *::after {
    animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; transition-delay: 0ms !important; scroll-behavior: auto !important; }
}
